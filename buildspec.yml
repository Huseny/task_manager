version: 0.2

env:
  variables:
    REPORT_BUCKET: "mindflow_tasks_log"
    CLONE_DIR: "project_bundle"
    TARGET_DIR: "project_bundle/repo"
  secrets-manager:
    DOCKER_USER: "dockerhub/creds:username"
    DOCKER_TOKEN: "dockerhub/creds:password"
    # GITHUB_PAT: "github/pat:token" # Uncomment if using private repos

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "=== INSTALL PHASE ==="
      - |
        set +e
        fail_and_upload() {
          reason="$1"
          echo "$reason" | tee /tmp/build_fail_reason.log
          if [ -n "${REPORT_BUCKET:-}" ] && command -v aws >/dev/null 2>&1; then
            KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
            JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
            BASE_KEY="${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}"
            echo "$reason" > /tmp/build_error.log
            for f in /tmp/*.log /tmp/*.txt; do
              [ -f "$f" ] || continue
              aws s3 cp "$f" "s3://${REPORT_BUCKET}/${BASE_KEY}/logs/$(basename "$f")" >/dev/null 2>&1 || true
            done
          fi
          exit 1
        }

        if ! docker info >/dev/null 2>&1; then
          fail_and_upload "Docker daemon not available — ensure CodeBuild project has privilegedMode=true"
        fi

  pre_build:
    commands:
      - |
        set +e
        fail_and_upload() {
          reason="$1"
          echo "$reason" | tee /tmp/build_fail_reason.log
          if [ -n "${REPORT_BUCKET:-}" ] && command -v aws >/dev/null 2>&1; then
            KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
            JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
            BASE_KEY="${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}"
            echo "$reason" > /tmp/build_error.log
            for f in /tmp/*.log /tmp/*.txt; do
              [ -f "$f" ] || continue
              aws s3 cp "$f" "s3://${REPORT_BUCKET}/${BASE_KEY}/logs/$(basename "$f")" >/dev/null 2>&1 || true
            done
          fi
          exit 1
        }

        echo "Cloning project..."
        if [ -z "${repo_url:-}" ]; then fail_and_upload "ERROR: repo_url is not set"; fi

        # Handle Git Authentication if PAT is provided
        if [ -n "${GITHUB_PAT:-}" ]; then
          git config --global url."https://${GITHUB_PAT}@github.com/".insteadOf "https://github.com/"
        fi

        if ! git clone "${repo_url}" "$CLONE_DIR" 2>&1 | tee /tmp/git_clone.log; then
          fail_and_upload "ERROR: git clone failed"
        fi

        echo "Running validator.py..."
        # validator.py is in the parent of the project_bundle according to your previous logic
        if ! python3 validator.py 2>&1 | tee /tmp/validator.log; then
          fail_and_upload "ERROR: validator.py failed"
        fi

        # Persist directory for the next phase
        echo "$(pwd)/$TARGET_DIR" > /tmp/build_dir
        true

  build:
    commands:
      - |
        set +e
        fail_and_upload() {
          reason="$1"
          echo "$reason" | tee /tmp/build_fail_reason.log
          if [ -n "${REPORT_BUCKET:-}" ] && command -v aws >/dev/null 2>&1; then
            KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
            JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
            BASE_KEY="${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}"
            echo "$reason" > /tmp/build_error.log
            for f in /tmp/*.log /tmp/*.txt; do
              [ -f "$f" ] || continue
              aws s3 cp "$f" "s3://${REPORT_BUCKET}/${BASE_KEY}/logs/$(basename "$f")" >/dev/null 2>&1 || true
            done
          fi
          exit 1
        }

        if [ -f /tmp/build_dir ]; then cd "$(cat /tmp/build_dir)"; else fail_and_upload "Target directory not found"; fi

        echo "Logging in to Docker Hub..."
        echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin

        echo "Starting Docker services..."
        if ! docker-compose up -d 2>&1 | tee /tmp/docker_compose.log; then
          fail_and_upload "ERROR: docker-compose up failed"
        fi

        echo "Executing tests..."
        TEST_SCRIPT=""
        [ -f "run_tests.sh" ] && TEST_SCRIPT="run_tests.sh"
        [ -f "run_test.sh" ] && [ -z "$TEST_SCRIPT" ] && TEST_SCRIPT="run_test.sh"

        if [ -n "$TEST_SCRIPT" ]; then
          chmod +x "$TEST_SCRIPT"
          if ! ./"$TEST_SCRIPT" 2>&1 | tee /tmp/tests.log; then
            fail_and_upload "ERROR: $TEST_SCRIPT failed"
          fi
        else
          fail_and_upload "ERROR: No test script found (run_tests.sh or run_test.sh)"
        fi

  post_build:
    commands:
      - |
        set -e
        echo "=== POST-BUILD PHASE ==="
        if [ -f /tmp/build_dir ]; then cd "$(cat /tmp/build_dir)"; fi

        # Capture Docker logs before shutting down
        if command -v docker-compose >/dev/null 2>&1; then
          docker-compose logs --no-color > /tmp/docker_runtime.log 2>&1 || true
          docker-compose down || true
        fi

        KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
        JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
        BASE_KEY="${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}"

        upload_s3() {
          if [ -n "${REPORT_BUCKET:-}" ] && [ -f "$1" ]; then
            aws s3 cp "$1" "s3://${REPORT_BUCKET}/${BASE_KEY}/$(basename "$1")"
          fi
        }

        # Upload all gathered logs
        for f in /tmp/*.log /tmp/*.txt; do
          [ -f "$f" ] || continue
          aws s3 cp "$f" "s3://${REPORT_BUCKET}/${BASE_KEY}/logs/$(basename "$f")"
        done

        # Look for any JSON reports generated by your tests
        REPORT_FILE=$(find . -maxdepth 2 -name "report.json" -print | head -n 1)
        if [ -n "$REPORT_FILE" ]; then
          upload_s3 "$REPORT_FILE"
        fi

        echo "=== POST-BUILD COMPLETE ==="

artifacts:
  files:
    - "**/*"
  name: validated-project-$(date +%Y-%m-%d)
