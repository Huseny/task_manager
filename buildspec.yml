version: 0.2

env:
  variables:
    REPORT_BUCKET: "mindflow-tasks-log"
    CLONE_DIR: "project_bundle"
    TARGET_DIR: "project_bundle/repo"
    COMBINED_LOG: "/tmp/build-execution.log"
  secrets-manager:
    DOCKER_USER: "dockerhub/creds:username"
    DOCKER_TOKEN: "dockerhub/creds:password"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "=== INSTALL PHASE ==="
      - touch "$COMBINED_LOG"
      - |
        set +e
        fail_and_upload() {
          reason="$1"
          echo "\n[FAILURE] $reason" >> "$COMBINED_LOG"
          if [ -n "${REPORT_BUCKET:-}" ] && command -v aws >/dev/null 2>&1; then
            KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
            JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
            aws s3 cp "$COMBINED_LOG" "s3://${REPORT_BUCKET}/${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}/build-execution.log" || true
          fi
          exit 1
        }

        if ! docker info >/dev/null 2>&1; then
          fail_and_upload "Docker daemon not available — ensure CodeBuild project has privilegedMode=true"
        fi

  pre_build:
    commands:
      - |
        set +e
        fail_and_upload() {
          reason="$1"
          echo "\n[FAILURE] $reason" >> "$COMBINED_LOG"
          if [ -n "${REPORT_BUCKET:-}" ]; then
            KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
            JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
            aws s3 cp "$COMBINED_LOG" "s3://${REPORT_BUCKET}/${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}/build-execution.log" || true
          fi
          exit 1
        }

        echo "==================== GIT CLONE ====================" >> "$COMBINED_LOG"
        if ! git clone "${repo_url}" "$CLONE_DIR" >> "$COMBINED_LOG" 2>&1; then
          fail_and_upload "git clone failed"
        fi

        echo "\n==================== VALIDATOR OUTPUT ====================" >> "$COMBINED_LOG"
        if ! python3 validator.py >> "$COMBINED_LOG" 2>&1; then
          fail_and_upload "validator.py failed"
        fi

        echo "\n==================== TRAJECTORY VALIDATION ====================" >> "$COMBINED_LOG"
        if ! python3 trajectory_validator.py "$CLONE_DIR/sessions" --batch >> "$COMBINED_LOG" 2>&1; then
          fail_and_upload "Trajectory validation failed (High Risk detected)"
        fi

        echo "$(pwd)/$TARGET_DIR" > /tmp/build_dir

  build:
    commands:
      - |
        set +e
        fail_and_upload() {
          reason="$1"
          echo "\n[FAILURE] $reason" >> "$COMBINED_LOG"
          if [ -n "${REPORT_BUCKET:-}" ]; then
            KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
            JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
            aws s3 cp "$COMBINED_LOG" "s3://${REPORT_BUCKET}/${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}/build-execution.log" || true
          fi
          exit 1
        }

        if [ -f /tmp/build_dir ]; then cd "$(cat /tmp/build_dir)"; else fail_and_upload "Target directory not found"; fi

        echo "\n==================== DOCKER SETUP ====================" >> "$COMBINED_LOG"
        echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin >> "$COMBINED_LOG" 2>&1

        if ! docker-compose up -d >> "$COMBINED_LOG" 2>&1; then
          fail_and_upload "docker-compose up failed"
        fi

        echo "\n==================== TEST SUITE ====================" >> "$COMBINED_LOG"
        TEST_SCRIPT=""
        [ -f "run_tests.sh" ] && TEST_SCRIPT="run_tests.sh"
        [ -f "run_test.sh" ] && [ -z "$TEST_SCRIPT" ] && TEST_SCRIPT="run_test.sh"

        if [ -n "$TEST_SCRIPT" ]; then
          chmod +x "$TEST_SCRIPT"
          if ! ./"$TEST_SCRIPT" >> "$COMBINED_LOG" 2>&1; then
            fail_and_upload "$TEST_SCRIPT failed"
          fi
        else
          fail_and_upload "No test script found"
        fi

  post_build:
    commands:
      - |
        set -e
        echo "\n==================== POST-BUILD CLEANUP ====================" >> "$COMBINED_LOG"
        if [ -f /tmp/build_dir ]; then cd "$(cat /tmp/build_dir)"; fi

        if command -v docker-compose >/dev/null 2>&1; then
          echo "\n--- Docker Service Logs ---" >> "$COMBINED_LOG"
          docker-compose logs --no-color >> "$COMBINED_LOG" 2>&1 || true
          docker-compose down >> "$COMBINED_LOG" 2>&1 || true
        fi

        echo "\nBuild process finished at $(date)" >> "$COMBINED_LOG"

        KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
        JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
        if [ -n "${REPORT_BUCKET:-}" ]; then
           aws s3 cp "$COMBINED_LOG" "s3://${REPORT_BUCKET}/${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}/build-execution.log"
        fi
