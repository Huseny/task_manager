version: 0.2

env:
  variables:
    REPORT_BUCKET: "mindflow-tasks-log"
    CLONE_DIR: "project_bundle"
    TARGET_DIR: "project_bundle/repo"
    COMBINED_LOG: "/tmp/build-execution.log"
    MINDFLOW_TASK_API_BASE_URL: "https://dev.aquila-core.net/api/v1/mindflow-tasks"
  secrets-manager:
    DOCKER_USER: "dockerhub/creds:username"
    DOCKER_TOKEN: "dockerhub/creds:password"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "=== INSTALL PHASE ==="
      - touch "$COMBINED_LOG"
      - |
        set +e
        fail_and_upload() {
          reason="$1"
          echo "\n[FAILURE] $reason" >> "$COMBINED_LOG"
          if [ -n "${REPORT_BUCKET:-}" ] && command -v aws >/dev/null 2>&1; then
            KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
            JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
            aws s3 cp "$COMBINED_LOG" "s3://${REPORT_BUCKET}/${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}/build-execution.log" >/dev/null 2>&1 || true
          fi
          exit 1
        }

        echo "==================== DOCKER ====================" >> "$COMBINED_LOG"
        docker --version >> "$COMBINED_LOG" 2>&1 || fail_and_upload "Docker not available"
        docker info >> "$COMBINED_LOG" 2>&1 || fail_and_upload "Docker daemon not available — ensure CodeBuild project has privilegedMode=true"

  pre_build:
    commands:
      - |
        set +e
        fail_and_upload() {
          reason="$1"
          echo "\n[FAILURE] $reason" >> "$COMBINED_LOG"
          if [ -n "${REPORT_BUCKET:-}" ]; then
            KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
            JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
            aws s3 cp "$COMBINED_LOG" "s3://${REPORT_BUCKET}/${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}/build-execution.log" || true
          fi
          exit 1
        }

        echo "==================== GIT CLONE ====================" >> "$COMBINED_LOG"
        if ! git clone "${repo_url}" "$CLONE_DIR" >> "$COMBINED_LOG" 2>&1; then
          fail_and_upload "git clone failed"
        fi

        echo "\n==================== VALIDATOR OUTPUT ====================" >> "$COMBINED_LOG"
        VALIDATOR_SCRIPT="validator.py"
        API_BASE_URL="${MINDFLOW_TASK_API_BASE_URL:-}"

        if [ -n "$API_BASE_URL" ]; then
          CLEAN_API_BASE_URL="$(echo "$API_BASE_URL" | sed 's#/*$##')"
          if [ -n "${repo_url:-}" ]; then
            LOOKUP_URL="$CLEAN_API_BASE_URL/batch/by-github-url"
            API_RESPONSE="$(curl -sS --connect-timeout 5 --max-time 20 --get --data-urlencode "github_url=${repo_url}" "$LOOKUP_URL" 2>>"$COMBINED_LOG")"
            CURL_EXIT_CODE=$?

            if [ $CURL_EXIT_CODE -eq 0 ] && [ -n "$API_RESPONSE" ]; then
              BATCH_NO="$(printf '%s' "$API_RESPONSE" | sed -n 's/.*"batch_no"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)"

              BATCH_NO_NORMALIZED="$(echo "$BATCH_NO" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
              if [ "$BATCH_NO_NORMALIZED" = "1" ] || [ "$BATCH_NO_NORMALIZED" = "week1" ] || [ "$BATCH_NO_NORMALIZED" = "week-1" ] || [ "$BATCH_NO_NORMALIZED" = "w1" ]; then
                VALIDATOR_SCRIPT="week_1_validator.py"
                echo "[INFO] Batch lookup identified Week 1 task (batch_no=$BATCH_NO). Using $VALIDATOR_SCRIPT" >> "$COMBINED_LOG"
              else
                echo "[INFO] Batch lookup did not identify Week 1 (batch_no=$BATCH_NO). Using validator.py" >> "$COMBINED_LOG"
              fi
            else
              echo "[WARN] Batch lookup API call failed. Falling back to validator.py" >> "$COMBINED_LOG"
            fi
          else
            echo "[WARN] repo_url was empty. Falling back to validator.py" >> "$COMBINED_LOG"
          fi
        else
          echo "[INFO] MINDFLOW_TASK_API_BASE_URL not set. Using validator.py" >> "$COMBINED_LOG"
        fi

        if ! python3 "$VALIDATOR_SCRIPT" >> "$COMBINED_LOG" 2>&1; then
          fail_and_upload "$VALIDATOR_SCRIPT failed"
        fi

        # echo "\n==================== TRAJECTORY VALIDATION ====================" >> "$COMBINED_LOG"
        # if ! python3 trajectory_validator.py "$CLONE_DIR/sessions" --batch >> "$COMBINED_LOG" 2>&1; then
        #   fail_and_upload "Trajectory validation failed (High Risk detected)"
        # fi

        echo "$(pwd)/$TARGET_DIR" > /tmp/build_dir

  build:
    commands:
      - |
        set +e
        fail_and_upload() {
          reason="$1"
          echo "\n[FAILURE] $reason" >> "$COMBINED_LOG"
          if [ -n "${REPORT_BUCKET:-}" ]; then
            KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
            JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
            aws s3 cp "$COMBINED_LOG" "s3://${REPORT_BUCKET}/${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}/build-execution.log" || true
          fi
          exit 1
        }

        if [ -f /tmp/build_dir ]; then cd "$(cat /tmp/build_dir)"; else fail_and_upload "Target directory not found"; fi

        echo "\n==================== DOCKER SETUP ====================" >> "$COMBINED_LOG"
        echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin >> "$COMBINED_LOG" 2>&1

        if docker compose version >/dev/null 2>&1; then
          COMPOSE_CMD="docker compose"
        elif command -v docker-compose >/dev/null 2>&1; then
          COMPOSE_CMD="docker-compose"
        else
          fail_and_upload "Docker Compose is not installed"
        fi

        if ! $COMPOSE_CMD up -d >> "$COMBINED_LOG" 2>&1; then
          fail_and_upload "docker compose up failed"
        fi

        echo "\n==================== TEST SUITE ====================" >> "$COMBINED_LOG"
        $COMPOSE_CMD stop >> "$COMBINED_LOG" 2>&1 || true
        TEST_SCRIPT=""
        [ -f "run_tests.sh" ] && TEST_SCRIPT="run_tests.sh"
        [ -f "run_test.sh" ] && [ -z "$TEST_SCRIPT" ] && TEST_SCRIPT="run_test.sh"

        if [ -n "$TEST_SCRIPT" ]; then
          chmod +x "$TEST_SCRIPT"
          if ! ./"$TEST_SCRIPT" >> "$COMBINED_LOG" 2>&1; then
            fail_and_upload "$TEST_SCRIPT failed"
          fi
        else
          fail_and_upload "No test script found"
        fi

  post_build:
    commands:
      - |
        set -e
        echo "\n==================== POST-BUILD CLEANUP ====================" >> "$COMBINED_LOG"
        if [ -f /tmp/build_dir ]; then cd "$(cat /tmp/build_dir)"; fi

        if docker compose version >/dev/null 2>&1; then
          COMPOSE_CMD="docker compose"
        elif command -v docker-compose >/dev/null 2>&1; then
          COMPOSE_CMD="docker-compose"
        else
          COMPOSE_CMD=""
        fi

        if [ -n "$COMPOSE_CMD" ]; then
          echo "\n--- Docker Service Logs ---" >> "$COMBINED_LOG"
          $COMPOSE_CMD logs --no-color >> "$COMBINED_LOG" 2>&1 || true
          $COMPOSE_CMD down >> "$COMBINED_LOG" 2>&1 || true
        fi

        echo "\nBuild process finished at $(date)" >> "$COMBINED_LOG"

        KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
        JOB_ID_VAL="${JOB_ID:-${CODEBUILD_BUILD_ID}}"
        if [ -n "${REPORT_BUCKET:-}" ]; then
           aws s3 cp "$COMBINED_LOG" "s3://${REPORT_BUCKET}/${KEY_PREFIX:+${KEY_PREFIX}/}${JOB_ID_VAL}/build-execution.log"
        fi
