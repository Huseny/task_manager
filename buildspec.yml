version: 0.2

env:
  variables:
    REPORT_BUCKET: "mindflow_tasks_log"
    LOG_DIR: "/tmp/build-logs"
    COMBINED_LOG: "/tmp/build-logs/build-execution.log"
    ERROR_MESSAGE_FILE: "/tmp/build-logs/error-message.txt"
  secrets-manager:
    DOCKER_USER: "dockerhub/creds:username"
    DOCKER_TOKEN: "dockerhub/creds:password"

phases:
  install:
    runtime-versions:
      python: 3.x
    commands:
      - echo "Initializing environment and log directories..."
      - mkdir -p "$LOG_DIR"
      - echo "errorMessage=none" > "$ERROR_MESSAGE_FILE"
      - touch "$COMBINED_LOG"
      - docker-compose version

  pre_build:
    on-failure: ABORT
    commands:
      - echo "Cloning project from Github..."
      - git clone ${repo_url} project_bundle
      - cd project_bundle || exit 1
      - echo "Validating project structure..."
      - |
        {
          echo "===== validator.py output (start: $(date -u)) ====="
          if ! python3 ../validator.py; then
            echo "errorMessage=validator.py failed in pre_build phase" > "$ERROR_MESSAGE_FILE"
            exit 1
          fi
          echo "===== validator.py output (end: $(date -u)) ====="
        } >> "$COMBINED_LOG" 2>&1

  build:
    on-failure: ABORT
    commands:
      - cd project_bundle/repo || exit 1
      - echo "Logging in to Docker Hub..."
      - echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin
      - |
        {
          echo "===== docker-compose up output (start: $(date -u)) ====="
          if ! docker-compose up -d; then
            echo "errorMessage=docker-compose up failed in build phase" > "$ERROR_MESSAGE_FILE"
            exit 1
          fi
          echo "===== docker-compose up output (end: $(date -u)) ====="
        } >> "$COMBINED_LOG" 2>&1

      - echo "Executing test suite..."
      - |
        # Check for test script existence and execute
        TEST_SCRIPT=""
        [ -f "run_tests.sh" ] && TEST_SCRIPT="run_tests.sh"
        [ -f "run_test.sh" ] && [ -z "$TEST_SCRIPT" ] && TEST_SCRIPT="run_test.sh"

        if [ -n "$TEST_SCRIPT" ]; then
          chmod +x "$TEST_SCRIPT"
          if ! ./"$TEST_SCRIPT"; then
            echo "errorMessage=$TEST_SCRIPT failed in build phase" > "$ERROR_MESSAGE_FILE"
            exit 1
          fi
        else
          echo "errorMessage=test script not found" > "$ERROR_MESSAGE_FILE"
          exit 1
        fi

  post_build:
    commands:
      - echo "Build process completed on $(date)"
      # Safely attempt to gather logs if the directory exists
      - |
        if [ -d "project_bundle/repo" ]; then
          cd project_bundle/repo
          echo "===== docker-compose service logs snapshot =====" >> "$COMBINED_LOG"
          docker-compose logs --no-color >> "$COMBINED_LOG" 2>&1 || true
          docker-compose down || true
        fi
      - |
        # S3 Upload logic
        upload_s3() {
          if [ -f "$1" ] && [ -n "$REPORT_BUCKET" ]; then
            KEY_PREFIX=$(echo "${REPORT_PREFIX:-}" | sed 's#^/*##;s#/*$##')
            DEST="s3://${REPORT_BUCKET}/${KEY_PREFIX:+$KEY_PREFIX/}$(basename $1)"
            echo "Uploading $1 to $DEST"
            aws s3 cp "$1" "$DEST" || echo "Upload failed for $1"
          fi
        }

        # Append error message to combined log for visibility before upload
        echo "===== final status check =====" >> "$COMBINED_LOG"
        cat "$ERROR_MESSAGE_FILE" >> "$COMBINED_LOG"

        upload_s3 "$COMBINED_LOG"
        upload_s3 "$ERROR_MESSAGE_FILE"

artifacts:
  files:
    - "**/*"
  name: validated-project-$(date +%Y-%m-%d)
