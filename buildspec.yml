version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.x
    commands:
      - echo "Ensuring docker and docker-compose are available..."
      -  # Ensure docker-compose is available (usually pre-installed in Standard images)
      - docker-compose version

  pre_build:
    commands:
      - echo "Cloning project from Github..."
      - git clone ${repo_url} project_bundle

      - echo "Navigating to project and validating structure..."
      # This handles your requirement of being at the parent level or root
      - cd project_bundle || exit 1
      - python3 ../validator.py

  build:
    commands:
      - echo "Navigating to the repo/ project directory..."
      - cd repo || exit 1
      - echo "Validation passed. Starting Docker services..."
      # Use -d to run in background, --build to ensure fresh images
      - docker-compose up -d

      - echo "Executing test suite..."
      # Check which script exists and run it
      - |
        if [ -f "run_tests.sh" ]; then
          chmod +x run_tests.sh && ./run_tests.sh
        elif [ -f "run_test.sh" ]; then
          chmod +x run_test.sh && ./run_test.sh
        else
          echo "Test script not found despite validation!" && exit 1
        fi

  post_build:
    commands:
      - echo "Build process completed on `date`"
      - docker-compose down
      - echo "Findings recorded."

artifacts:
  files:
    - "**/*"
  name: validated-project-$(date +%Y-%m-%d)
